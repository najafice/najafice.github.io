      year: 2020
      description:
        - 3rd International Conference on Civil Engineering, Architecture, and
          Urban Management in Iran.
        - Developed a polynomial regression model correlating shear wave
          velocity (Vs) with CPT parameters, including cone tip resistance,
          sleeve friction, and vertical effective stress.
        - Used a global dataset and demonstrated improved reliability compared
          with existing CPT-Vs correlations.
